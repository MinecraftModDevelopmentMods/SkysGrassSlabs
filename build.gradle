tasks.register('verifyReleaseArtifacts') {
    group = 'verification'
    dependsOn tasks.named('assemble'), tasks.named('verifyReleaseMetadata')
    doLast {
        File libs = layout.buildDirectory.dir('libs').get().asFile
        releaseFiles.get().each { name ->
            File candidate = new File(libs, name)
            if (!candidate.isFile() || candidate.length() == 0) {
                throw new GradleException("Missing release artifact: ${candidate}")
            }
        }
        ZipFile zip = new ZipFile(new File(libs, releaseFiles.get()[0]))
        try {
            Set<String> names = zip.entries().collect { it.name } as Set<String>
            ['META-INF/mods.toml', 'META-INF/coremods.json',
             'coremods/skysgrassslabs_legacy_world.js',
             'META-INF/LICENSE', 'META-INF/LICENSE.spdx', 'META-INF/NOTICE',
             'data/skysgrassslabs/advancements/recipes/turf.json',
             'data/skysgrassslabs/recipes/turf.json',
             'data/forge/tags/items/seeds.json',
             'data/minecraft/tags/blocks/mineable/shovel.json',
             'zone/moddev/mc/skysgrassslabs/SkysGrassSlabs.class'].each { required ->
                if (!names.contains(required)) throw new GradleException("Release jar is missing ${required}")
            }
            Set<String> forbidden = names.findAll { entry ->
                String lower = entry.toLowerCase(Locale.ROOT)
                lower.contains('agent') || lower.contains('.codex') || lower.contains('.claude') ||
                        lower.contains('/test/') || lower.contains('gametest') ||
                        lower.contains('integrationtest') || lower.contains('clienttest') ||
                        lower.contains('legacytest') || lower.contains('fixturegenerator') ||
                        lower.startsWith('d' + ':' + '/') ||
                        lower.startsWith('c' + ':' + '/users/')
            }
            if (!forbidden.isEmpty()) throw new GradleException("Forbidden release entries: ${forbidden}")

            List<String> wrongBytecode = []
            zip.entries().findAll { entry ->
                !entry.directory && entry.name.endsWith('.class')
            }.each { entry ->
                DataInputStream classInput = new DataInputStream(zip.getInputStream(entry))
                try {
                    if (classInput.readInt() != (int) 0xCAFEBABE) {
                        throw new GradleException("Invalid class file in release jar: ${entry.name}")
                    }
                    classInput.readUnsignedShort()
                    int major = classInput.readUnsignedShort()
                    if (major != 61) wrongBytecode.add("${entry.name}=${major}")
                } finally {
                    classInput.close()
                }
            }
            if (!wrongBytecode.isEmpty()) {
                throw new GradleException(
                        "Release jar must contain only Java 17 class files (major 61): ${wrongBytecode}")
            }

            String windowsPathPrefix = ':' + ((char) 92)
            List<String> forbiddenContent = [
                    'c' + windowsPathPrefix + 'users' + ((char) 92),
                    'd' + windowsPathPrefix + 'skysgrassslabs',
                    '/' + 'home' + '/' + 'runner' + '/',
                    'agent-notes', 'agent_notes', '.codex', '.claude', '.cursor'
            ]
            zip.entries().each { entry ->
                if (!entry.directory) {
                    String content = new String(zip.getInputStream(entry).bytes,
                            StandardCharsets.ISO_8859_1).toLowerCase(Locale.ROOT)
                    String match = forbiddenContent.find { content.contains(it) }
                    if (match != null) {
                        throw new GradleException(
                                "Release entry ${entry.name} contains forbidden local context: ${match}")
                    }
                }
            }
        } finally {
            zip.close()
        }

        List<String> localeFiles = [
                'de_at.json', 'de_au.json', 'de_de.json',
                'en_ca.json', 'en_en.json', 'en_gb.json', 'en_pt.json', 'en_us.json',
                'es_es.json', 'es_mx.json', 'fr_ca.json', 'fr_fr.json',
                'ja_jp.json', 'ko_kr.json', 'pt_br.json', 'pt_pt.json',
                'ru_ru.json', 'zh_cn.json'
        ]
        releaseFiles.get()[0..1].each { artifactName ->
            ZipFile localizedZip = new ZipFile(new File(libs, artifactName))
            try {
                localeFiles.each { localeName ->
                    String entryName = "assets/skysgrassslabs/lang/${localeName}"
                    def entry = localizedZip.getEntry(entryName)
                    if (entry == null) {
                        throw new GradleException("${artifactName} is missing ${entryName}")
                    }
                    File source = file("src/main/resources/${entryName}")
                    byte[] sourceBytes = Files.readAllBytes(source.toPath())
                    byte[] archiveBytes = localizedZip.getInputStream(entry).bytes
                    if (!Arrays.equals(sourceBytes, archiveBytes)) {
                        throw new GradleException(
                                "${artifactName} changed the UTF-8 bytes of ${entryName}")
                    }
                }
            } finally {
                localizedZip.close()
            }
        }
    }
}

tasks.register('writeReleaseChecksums') {
    group = 'verification'
    dependsOn tasks.named('verifyReleaseArtifacts')
    inputs.files(releaseFiles.map { names ->
        names.collect { name -> new File(layout.buildDirectory.dir('libs').get().asFile, name) }
    })
    def output = layout.buildDirectory.file('release/SHA256SUMS')
    outputs.file(output)
    doLast {
        File libs = layout.buildDirectory.dir('libs').get().asFile
        File checksumFile = output.get().asFile
        checksumFile.parentFile.mkdirs()
        checksumFile.setText(releaseFiles.get().collect { name ->
            File candidate = new File(libs, name)
            MessageDigest digest = MessageDigest.getInstance('SHA-256')
            candidate.withInputStream { input ->
                byte[] buffer = new byte[8192]
                for (int read = input.read(buffer); read >= 0; read = input.read(buffer)) {
                    if (read > 0) digest.update(buffer, 0, read)
                }
            }
            "${digest.digest().encodeHex().toString().toUpperCase()}  ${name}"
        }.join('\n') + '\n', 'UTF-8')
    }
}

def preparedReleaseDir = providers.gradleProperty('preparedReleaseDir')
tasks.register('verifyPreparedReleaseArtifacts') {
    group = 'verification'
    onlyIf { preparedReleaseDir.isPresent() }
    doLast {
        File prepared = file(preparedReleaseDir.get())
        Set<String> expected = (releaseFiles.get() + ['SHA256SUMS', 'CHANGELOG.md']) as Set<String>
        Set<String> actual = prepared.listFiles()?.findAll { it.isFile() }*.name as Set<String>
        if (actual != expected) {
            throw new GradleException("Prepared release files differ: expected ${expected}, found ${actual}")
        }
    }
}

def mavenUploadUrl = providers.environmentVariable('MAVEN_UPLOAD_URL')
def mavenUploadUsername = providers.environmentVariable('MAVEN_UPLOAD_USERNAME')
def mavenUploadPassword = providers.environmentVariable('MAVEN_UPLOAD_PASSWORD')
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifactId = base.archivesName.get()
            if (preparedReleaseDir.isPresent()) {
                artifact(file("${preparedReleaseDir.get()}/${releaseFiles.get()[0]}")) {
                    extension = 'jar'
                }
                artifact(file("${preparedReleaseDir.get()}/${releaseFiles.get()[1]}")) {
                    classifier = 'sources'
                    extension = 'jar'
                }
                artifact(file("${preparedReleaseDir.get()}/${releaseFiles.get()[2]}")) {
                    classifier = 'javadoc'
                    extension = 'jar'
                }
            } else {
                artifact releaseJar
                artifact tasks.named('sourcesJar')
                artifact tasks.named('javadocJar')
            }
            pom {
                name = "Sky's Grass Slabs"
                description = project.mod_description
                url = 'https://github.com/MinecraftModDevelopmentMods/SkysGrassSlabs'
                licenses {
                    license {
                        name = 'GNU Lesser General Public License, Version 2.1'
                        url = 'https://www.gnu.org/licenses/old-licenses/lgpl-2.1.txt'
                    }
                }
                scm {
                    connection = 'scm:git:https://github.com/MinecraftModDevelopmentMods/SkysGrassSlabs.git'
                    developerConnection = 'scm:git:ssh://git@github.com/MinecraftModDevelopmentMods/SkysGrassSlabs.git'
                    url = 'https://github.com/MinecraftModDevelopmentMods/SkysGrassSlabs'
                }
            }
        }
    }
    repositories {
        maven {
            name = 'release'
            url = mavenUploadUrl.isPresent()
                    ? uri(mavenUploadUrl.get())
                    : layout.buildDirectory.dir('forbidden-local-release').get().asFile.toURI()
            credentials {
                username = mavenUploadUsername.orNull ?: ''
                password = mavenUploadPassword.orNull ?: ''
            }
        }
    }
}

tasks.register('validateMavenReleaseCredentials') {
    group = 'publishing'
    doLast {
        if (!mavenUploadUrl.isPresent() || !mavenUploadUsername.isPresent() || !mavenUploadPassword.isPresent()) {
            throw new GradleException('MAVEN_UPLOAD_URL, MAVEN_UPLOAD_USERNAME, and MAVEN_UPLOAD_PASSWORD are required')
        }
        if (mavenUploadUrl.get().startsWith('file:')) {
            throw new GradleException('Maven release publication must use a remote repository')
        }
    }
}
tasks.withType(PublishToMavenRepository).configureEach {
    dependsOn tasks.named('validateMavenReleaseCredentials')
    if (preparedReleaseDir.isPresent()) {
        dependsOn tasks.named('verifyPreparedReleaseArtifacts')
    } else {
        dependsOn tasks.named('verifyReleaseArtifacts')
    }
}

idea {
    module { downloadSources = true; downloadJavadoc = true }
}
eclipse {
    classpath {
        downloadSources = true
        downloadJavadoc = true
        defaultOutputDir = file('bin/default')
        file.whenMerged { classpath ->
            classpath.entries.findAll { it.kind == 'src' }.each { entry ->
                if (entry.path.startsWith('src/main/')) {
                    entry.output = 'bin/main'
                } else if (entry.path.startsWith('src/gameTest/')) {
                    entry.output = 'bin/gameTest'
                    entry.entryAttributes['test'] = 'true'
                } else if (entry.path.startsWith('src/test/')) {
                    entry.output = 'bin/test'
                    entry.entryAttributes['test'] = 'true'
                }
            }
        }
    }
    synchronizationTasks 'isolateEclipseProductionRuns'
}

def prepareEclipseResources = tasks.register('prepareEclipseResources') {
    group = 'ide'
    dependsOn tasks.named('processResources')
    doLast {
        project.copy {
            from(layout.buildDirectory.dir('resources/main'))
            into(layout.projectDirectory.dir('bin/main'))
        }
    }
}

def configureEclipseBuildship = tasks.register('configureEclipseBuildship') {
    group = 'ide'
    doLast {
        File preferencesFile = file('.settings/org.eclipse.buildship.core.prefs')
        Properties preferences = new Properties()
        if (preferencesFile.isFile()) preferencesFile.withInputStream { preferences.load(it) }
        [
                'eclipse.preferences.version': '1',
                'connection.gradle.distribution': 'GRADLE_DISTRIBUTION(WRAPPER)',
                'connection.gradle.user.home': gradle.gradleUserHomeDir.canonicalPath,
                'connection.project.dir': '',
                'gradle.user.home': gradle.gradleUserHomeDir.canonicalPath,
                'override.workspace.settings': 'true'
        ].each { key, value -> preferences.setProperty(key, value) }
        preferencesFile.parentFile.mkdirs()
        preferencesFile.withOutputStream { preferences.store(it, 'Generated Buildship configuration.') }
    }
}

tasks.register('isolateEclipseProductionRuns') {
    group = 'ide'
    dependsOn tasks.named('genEclipseRuns')
    dependsOn configureEclipseBuildship
    dependsOn prepareEclipseResources
    doLast {
        // Some ForgeGradle launch variants emit MC_VERSION as an environment
        // token. Store the target value literally when that form is present.
        fileTree(project.projectDir) {
            include 'run*.launch'
        }.files.each { File launch ->
            String contents = launch.getText('UTF-8')
            contents = contents.replace(
                    'key="MC_VERSION" value="${MC_VERSION}"',
                    "key=\"MC_VERSION\" value=\"${minecraft_version}\"")
            launch.setText(contents.replace('\r\n', '\n'), 'UTF-8')
        }

        ['runClient.launch', 'runServer.launch', 'runTestClient.launch', 'runTestServer.launch',
                'runGameTestServer.launch'].each { name ->
            File launch = file(name)
            if (!launch.isFile()) throw new GradleException("ForgeGradle did not generate ${name}")
            String contents = launch.getText('UTF-8')
            // GameTests load through their separate merged mod directory, not the unit-test output.
            boolean excludesUnitTests = name in ['runClient.launch', 'runServer.launch', 'runGameTestServer.launch']
            if (excludesUnitTests && !contents.contains('org.eclipse.jdt.launching.ATTR_EXCLUDE_TEST_CODE')) {
                contents = contents.replace('</launchConfiguration>',
                        '  <booleanAttribute key="org.eclipse.jdt.launching.ATTR_EXCLUDE_TEST_CODE" value="true"/>' +
                                System.lineSeparator() + '</launchConfiguration>')
            }
            ['--cache', '--metadata', '--to-srg', '--to-obf'].each { option ->
                String prefix = option + ' '
                int start = contents.indexOf(prefix)
                if (start < 0) throw new GradleException("${name} is missing ${option}")
                start += prefix.length()
                int end = contents.indexOf(' --', start)
                if (end < 0) throw new GradleException("${name} has malformed ${option}")
                String value = contents.substring(start, end)
                if (value.find(/\s/) != null && !value.startsWith('&quot;')) {
                    contents = contents.substring(0, start) + '&quot;' + value + '&quot;' + contents.substring(end)
                }
            }
            launch.setText(contents, 'UTF-8')
        }
    }
}

tasks.register('verifyEclipseProductionClasspath') {
    group = 'verification'
    dependsOn tasks.named('eclipseClasspath'), tasks.named('isolateEclipseProductionRuns')
    doLast {
        File prefsFile = file('.settings/org.eclipse.buildship.core.prefs')
        if (!prefsFile.isFile()) throw new GradleException('Missing Buildship preferences')
        Properties prefs = new Properties()
        prefsFile.withInputStream { prefs.load(it) }
        if (file(prefs.getProperty('connection.gradle.user.home', '')).canonicalFile != gradle.gradleUserHomeDir.canonicalFile) {
            throw new GradleException('Eclipse Buildship uses the wrong Gradle home')
        }
        Set<String> legacyLwjglArtifacts = configurations.compileClasspath.resolvedConfiguration
                .resolvedArtifacts
                .findAll { it.moduleVersion.id.group == 'org.lwjgl.lwjgl' }
                .collect { "${it.moduleVersion.id.group}:${it.name}:${it.moduleVersion.id.version}" }
                .toSet()
        if (!legacyLwjglArtifacts.isEmpty()) {
            throw new GradleException(
                    "Forge 1.19 Eclipse classpath contains sealed LWJGL 2 artifacts: ${legacyLwjglArtifacts}")
        }
        File metadata = file('bin/main/META-INF/mods.toml')
        String metadataText = metadata.isFile() ? metadata.getText('UTF-8') : ''
        if (!metadataText.contains("version=\"${project.mod_version}\"") ||
                !metadataText.contains("versionRange=\"${project.minecraft_version_range}\"")) {
            throw new GradleException('Eclipse output contains incorrect mods.toml')
        }
        ['runClient.launch', 'runServer.launch'].each { name ->
            String contents = file(name).getText('UTF-8').replace('\\', '/')
            if (!contents.contains('org.eclipse.jdt.launching.ATTR_EXCLUDE_TEST_CODE') ||
                    contents.contains('src/test') || contents.contains('bin/test') || contents.contains('junit-')) {
                throw new GradleException("${name} exposes test code or dependencies")
            }
        }
        String gameTestLaunch = file('runGameTestServer.launch').getText('UTF-8').replace('\\', '/')
        if (!gameTestLaunch.contains('forge-run-mod-classes/gameTest') ||
                !gameTestLaunch.contains('org.eclipse.jdt.launching.ATTR_EXCLUDE_TEST_CODE') ||
                gameTestLaunch.contains('bin/test') || gameTestLaunch.contains('junit-')) {
            throw new GradleException('The GameTest launch must load only its isolated test mod output')
        }
        def classpath = new groovy.xml.XmlSlurper().parse(file('.classpath'))
        ['main', 'test', 'gameTest'].each { source ->
            def entries = classpath.classpathentry.findAll { it.@kind == 'src' &&
                    it.@path.text().startsWith("src/${source}/") }
            if (entries.isEmpty() || entries.any { it.@output.text() != "bin/${source}" }) {
                throw new GradleException("Eclipse ${source} output is missing or shared with another source set")
            }
            if (source != 'main' && entries.any { entry ->
                entry.attributes.attribute.find { it.@name == 'test' && it.@value == 'true' }.isEmpty()
            }) throw new GradleException("Eclipse ${source} code is not marked as test-only")
        }
        fileTree(project.projectDir) {
            include 'run*.launch'
        }.files.each { File launch ->
            String contents = launch.getText('UTF-8')
            if (contents.contains('${MC_VERSION}')) {
                throw new GradleException(
                        "${launch.name} retains ForgeGradle's unresolved MC_VERSION token")
            }
            boolean hasLiteralEnvironmentVersion = contents.contains(
                    "key=\"MC_VERSION\" value=\"${minecraft_version}\"")
            boolean hasLiteralForgeArgument = contents.contains(
                    "--fml.mcVersion ${minecraft_version}")
            if (!hasLiteralEnvironmentVersion && !hasLiteralForgeArgument) {
                throw new GradleException(
                        "${launch.name} does not define Minecraft ${minecraft_version} literally")
            }
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('verifyReleaseMetadata')
}

tasks.named('genEclipseRuns') {
    dependsOn prepareGameTestModClasses, prepareGameTestRun
}
