tasks.withType(JavaExec).configureEach { JavaExec runTask ->
    if (['runClient', 'runServer', 'runGameTestServer', 'runData'].contains(runTask.name)) {
        def mergedOutput = runTask.name == 'runGameTestServer'
                ? forgeRunGameTestClassesDirectory : forgeRunModClassesDirectory
        runTask.dependsOn(runTask.name == 'runGameTestServer'
                ? prepareForgeRunGameTestClasses : prepareForgeRunModClasses)
        runTask.doFirst {
            Set<String> splitOutputs = (sourceSets.main.output.files +
                    (runTask.name == 'runGameTestServer' ? sourceSets.gameTest.output.files : []))
                    .collect {
                it.canonicalFile.absolutePath
            } as Set
            Collection<File> targetClasspath = runTask.classpath.files.findAll {
                !splitOutputs.contains(it.canonicalFile.absolutePath)
            }
            runTask.classpath = files(mergedOutput, targetClasspath)
            runTask.environment 'MOD_CLASSES', "${mod_id}%%${mergedOutput}"
        }
    }
}

