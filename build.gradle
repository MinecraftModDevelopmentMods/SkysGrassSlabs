def createPackagedServerProcess = { String taskName, String phase, String directoryName,
        Object dependency ->
    tasks.register(taskName, Exec) {
        group = 'verification'
        dependsOn dependency
        File runDirectory = layout.buildDirectory.dir(directoryName).get().asFile
        workingDir runDirectory
        doFirst {
            File runtime = requireRuntimeDirectory(packagedForgeServerRuntime,
                    'packagedForgeServerRuntime')
            File launcher = new File(runtime,
                    "forge-${project.minecraft_version}-${project.forge_version}.jar")
            File vanillaServer = new File(runtime,
                    "minecraft_server.${project.minecraft_version}.jar")
            File libraries = new File(runtime, 'libraries')
            [launcher, vanillaServer, libraries].each {
                if (!it.exists()) throw new GradleException(
                        "Incomplete official Forge server runtime: ${it}")
            }
            List<String> command = [
                    java8Launcher.get().executablePath.asFile.absolutePath,
                    '-Djava.net.preferIPv4Stack=true',
                    '-Dforge.logging.console.level=info',
                    "-Dskysgrassslabs.integrationPhase=${phase}"
            ]
            if (phase.startsWith('forward-sylvester')) {
                command.addAll(['-Xms1G', '-Xmx8G'])
            }
            if (phase.startsWith('upgrade-') || phase.startsWith('forward-sylvester')) {
                command.add('-Dfml.queryResult=confirm')
            }
            command.addAll(['-jar', launcher.absolutePath, 'nogui'])
            commandLine command
        }
        doLast {
            File marker = new File(runDirectory,
                    'world/skysgrassslabs-integration.properties')
            if (!marker.isFile()) {
                throw new GradleException("Packaged ${phase} marker is missing: ${marker}")
            }
            Properties values = new Properties()
            marker.withInputStream { values.load(it) }
            String key = phase.replace('-', '_') + '_complete'
            if (values.getProperty(key) != 'true') {
                throw new GradleException("Packaged ${phase} did not complete: ${marker}")
            }
        }
    }
}

def acceptedForge31LogNoise = [
        ~/FML appears to be missing any signature data/,
        ~/Found multiple arguments for option fml\.mcVersion/,
        ~/Found multiple arguments for option fml\.forgeVersion/,
        ~/\/(?:ERROR|FATAL)\] \[net\.minecraftforge\.fml\.network\.simple\.IndexedMessageCodec\/SIMPLENET\]: Received empty payload on channel fml:handshake$/,
        ~/\/FATAL\] \[net\.minecraftforge\.common\.ForgeConfig\/CORE\]: Forge config just got changed on the file system!$/,
        ~/\/FATAL\] \[net\.minecraftforge\.fml\.packs\.ModFileResourcePack\/\]: Failed to clean up tempdir /
]

def verifyPackagedRun = { File runDirectory, String label ->
    List<File> crashReports = fileTree(new File(runDirectory, 'crash-reports')).files as List<File>
    if (!crashReports.isEmpty()) {
        throw new GradleException("${label} produced crash reports: ${crashReports}")
    }
    File latest = new File(runDirectory, 'logs/latest.log')
    if (!latest.isFile()) {
        throw new GradleException("${label} did not produce a server log")
    }
    List<String> failures = []
    [latest, new File(runDirectory, 'logs/debug.log')].findAll { it.isFile() }.each { log ->
        int lineNumber = 0
        log.eachLine('UTF-8') { String line ->
            ++lineNumber
            boolean severe = line ==~ /.*\/(?:ERROR|FATAL)\].*/
            boolean accepted = acceptedForge31LogNoise.any { line =~ it }
            boolean fatalText = line.contains('Encountered an unexpected exception') ||
                    line.contains('Exception stopping the server') ||
                    line.contains('integration audit failed') ||
                    line.contains('Missing Mods:') ||
                    line.contains('MissingModsException') ||
                    line.contains('NoSuchMethodError') ||
                    line.contains('NoClassDefFoundError') ||
                    line.contains('ExceptionInInitializerError') ||
                    line.contains('cascading worldgen lag')
            if ((severe && !accepted) || fatalText) {
                failures.add("${log.name}:${lineNumber}: ${line}")
            }
        }
    }
    if (!failures.isEmpty()) {
        throw new GradleException("${label} logs contain failures:\n" + failures.join('\n'))
    }
}

