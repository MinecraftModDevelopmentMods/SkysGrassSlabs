import java.security.MessageDigest
import java.nio.charset.StandardCharsets
import java.util.zip.ZipFile

plugins {
    id 'java'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.renamer' version '1.1.5'
    id 'net.minecraftforge.gradle' version '7.0.34'
}

def mavenizerCompatibilityJar = layout.projectDirectory.file(
        'ci-fixtures/tools/minecraft-mavenizer-0.5.21-forge-1.18.jar')
def mavenizerCompatibilitySha256 =
        '28A6697BDF6D9500EC0AF9C1C949B9F3ED7DDFDA649CB5CAC4BEEA2E9567570A'

// ForgeGradle 7's Mavenizer recompilation rejects a redundant accessor emitted
// by Forge 40's 1.18.2 decompiler. This checksum-sealed build-only variant
// removes that accessor; the mod and every shipped class remain Java 17.
fgtools.configure('mavenizer') {
    classpath.from(mavenizerCompatibilityJar)
    mainClass.set('net.minecraftforge.mcmaven.cli.Main')
    javaLauncher.set(javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(25)
        vendor = JvmVendorSpec.ADOPTIUM
    })
}

version = mod_version
group = mod_group_id

base {
    archivesName = 'SkysGrassSlabs'
}

// Mojang ships Java 17 to end users in 1.18+, so your mod should target Java 17.
java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
    withSourcesJar()
    withJavadocJar()
}

sourceSets {
    gameTest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += output + compileClasspath
    }
}

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"
def gameTestRunDirectory = providers.gradleProperty('skysGrassSlabsGameTestRunDirectory')
        .getOrElse('run-gametest')
minecraft {
    // The mappings can be changed at any time and must be in the following format.
    // Channel:   Version:
    // official   MCVersion             Official field/method names from Mojang mapping files
    // parchment  YYYY.MM.DD-MCVersion  Open community-sourced parameter names and javadocs layered on top of official
    //
    // You must be aware of the Mojang license when using the 'official' or 'parchment' mappings.
    // See more information here: https://github.com/MinecraftForge/MCPConfig/blob/master/Mojang.md
    //
    // Parchment is an unofficial project maintained by ParchmentMC, separate from MinecraftForge
    // Additional setup is needed to use their mappings: https://github.com/ParchmentMC/Parchment/wiki/Getting-Started
    //
    // Use non-default mappings at your own risk. They may not always work.
    // Simply re-run your setup task after changing the mappings to update your workspace.
    mappings channel: mapping_channel, version: mapping_version

    // When true, this property will have all Eclipse/IntelliJ IDEA run configurations run the "prepareX" task for the given run configuration before launching the game.
    // In most cases, it is not necessary to enable.
    // enableEclipsePrepareRuns = true
    // enableIdeaPrepareRuns = true

    // When true, this property will add the folder name of all declared run configurations to generated IDE run configurations.
    // The folder name can be set on a run configuration using the "folderName" property.
    // By default, the folder name of a run configuration is the name of the Gradle project containing it.
    // generateRunFolders = true

    // This property enables access transformers for use in development.
    // They will be applied to the Minecraft artifact.
    // The access transformer file can be anywhere in the project.
    // However, it must be at "META-INF/accesstransformer.cfg" in the final mod jar to be loaded by Forge.
    // This default location is a best practice to automatically put the file in the right place in the final jar.
    // See https://docs.minecraftforge.net/en/latest/advanced/accesstransformers/ for more information.
    // accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        configureEach {
            workingDir.convention layout.projectDirectory.dir('run')
            jvmArgs '--add-opens', 'java.base/java.lang.invoke=ALL-UNNAMED'
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            systemProperty 'forge.logging.console.level', 'debug'
            systemProperty 'forge.enabledGameTestNamespaces', mod_id

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        register('client')

        register('server') {
            args '--nogui'
        }

        register('gameTestServer') {
            workingDir.convention layout.projectDirectory.dir(gameTestRunDirectory)
            mods {
                "${mod_id}" {
                    source sourceSets.gameTest
                }
            }
        }

        register('data') {
            workingDir.convention layout.projectDirectory.dir('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    exclusiveContent {
        forRepository { maven { url = 'https://repo.spongepowered.org/repository/maven-public' } }
        filter { includeGroupAndSubgroups('org.spongepowered') }
    }
    mavenCentral()
    maven { url = 'https://libraries.minecraft.net/' }
}

dependencies {
    implementation minecraft.dependency(
            "net.minecraftforge:forge:${project.minecraft_version}-${project.forge_version}")
    testImplementation 'junit:junit:4.13.2'
}

def verifyMavenizerCompatibilityFixture = tasks.register('verifyMavenizerCompatibilityFixture') {
    group = 'verification'
    description = 'Verifies the checksum-sealed Forge 1.18 Mavenizer compatibility tool.'
    inputs.file mavenizerCompatibilityJar
    doLast {
        File fixture = mavenizerCompatibilityJar.asFile
        if (!fixture.isFile()) {
            throw new GradleException("Missing Mavenizer compatibility fixture: ${fixture}")
        }
        MessageDigest digest = MessageDigest.getInstance('SHA-256')
        fixture.withInputStream { input ->
            byte[] buffer = new byte[8192]
            for (int read = input.read(buffer); read >= 0; read = input.read(buffer)) {
                if (read > 0) digest.update(buffer, 0, read)
            }
        }
        String actual = digest.digest().encodeHex().toString().toUpperCase()
        if (actual != mavenizerCompatibilitySha256) {
            throw new GradleException("Mavenizer compatibility fixture checksum mismatch: ${actual}")
        }
    }
}

tasks.named('compileJava', JavaCompile) {
    dependsOn verifyMavenizerCompatibilityFixture
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    archiveClassifier = 'deobf'
    destinationDirectory = layout.buildDirectory.dir('libs-dev')
    from(['LICENSE', 'LICENSE.spdx', 'NOTICE']) {
        into 'META-INF'
    }

    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1', // We are version 1 of ourselves
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Built-On-Java'           : '17',
                'Built-On'                : "${minecraft_version}-${forge_version}"
        ])
    }
}

def releaseJar = renamer.classes(tasks.named('jar', Jar)) {
    map.from minecraft.dependency.toSrgFile
    archiveClassifier = null
    output = layout.buildDirectory.file(
            "libs/${base.archivesName.get()}-${project.version}.jar")
}

['apiElements', 'runtimeElements'].each { configurationName ->
    configurations.named(configurationName) { artifacts.clear() }
    artifacts { add(configurationName, releaseJar) }
}

tasks.named('assemble') {
    dependsOn releaseJar
    dependsOn tasks.named('sourcesJar')
    dependsOn tasks.named('javadocJar')
}

tasks.named('sourcesJar', Jar) {
    from(['LICENSE', 'LICENSE.spdx', 'NOTICE']) { into 'META-INF' }
}

tasks.named('javadocJar', Jar) {
    from(['LICENSE', 'LICENSE.spdx', 'NOTICE']) { into 'META-INF' }
}

def releaseFiles = provider {
    [
            "${base.archivesName.get()}-${project.version}.jar",
            "${base.archivesName.get()}-${project.version}-sources.jar",
            "${base.archivesName.get()}-${project.version}-javadoc.jar"
    ]
}

tasks.register('verifyReleaseMetadata') {
    group = 'verification'
    doLast {
        if (project.minecraft_version != '1.18.2' || project.forge_version != '40.3.0' ||
                project.mapping_channel != 'official' || project.mapping_version != '1.18.2' ||
                project.loader_name != 'forge' || project.loader_code != '1' ||
                project.java_version != '17' || project.java_toolchain_version != '17.0.1+12' ||
                project.gradle_java_version != '17' || project.curseforge_project_id != '1677588') {
            throw new GradleException('Unexpected 1.18.2 release metadata')
        }
    }
}

tasks.register('verifyReleaseArtifacts') {
    group = 'verification'
    dependsOn tasks.named('assemble'), tasks.named('verifyReleaseMetadata')
    doLast {
        File libs = layout.buildDirectory.dir('libs').get().asFile
        releaseFiles.get().each { name ->
            File candidate = new File(libs, name)
            if (!candidate.isFile() || candidate.length() == 0) {
                throw new GradleException("Missing release artifact: ${candidate}")
            }
        }

        ZipFile zip = new ZipFile(new File(libs, releaseFiles.get()[0]))
        try {
            Set<String> names = zip.entries().collect { it.name } as Set<String>
            ['META-INF/mods.toml', 'META-INF/LICENSE', 'META-INF/LICENSE.spdx',
             'META-INF/NOTICE',
             'zone/moddev/mc/skysgrassslabs/SkysGrassSlabs.class'].each { required ->
                if (!names.contains(required)) {
                    throw new GradleException("Release jar is missing ${required}")
                }
            }
            Set<String> forbidden = names.findAll { entry ->
                String lower = entry.toLowerCase(Locale.ROOT)
                lower.contains('agent') || lower.contains('.codex') || lower.contains('.claude') ||
                        lower.contains('/test/') || lower.contains('gametest') ||
                        lower.startsWith('d' + ':' + '/') ||
                        lower.startsWith('c' + ':' + '/users/')
            }
            if (!forbidden.isEmpty()) {
                throw new GradleException("Forbidden release entries: ${forbidden}")
            }

            String windowsPathPrefix = ':' + ((char) 92)
            List<String> forbiddenContent = [
                    'c' + windowsPathPrefix + 'users' + ((char) 92),
                    'd' + windowsPathPrefix + 'skysgrassslabs',
                    '/' + 'home' + '/' + 'runner' + '/',
                    'agent-notes', 'agent_notes', '.codex', '.claude', '.cursor'
            ]
            zip.entries().each { entry ->
                if (!entry.directory) {
                    String content = new String(zip.getInputStream(entry).bytes,
                            StandardCharsets.ISO_8859_1).toLowerCase(Locale.ROOT)
                    String match = forbiddenContent.find { content.contains(it) }
                    if (match != null) {
                        throw new GradleException(
                                "Release entry ${entry.name} contains forbidden local context: ${match}")
                    }
                }
            }
        } finally {
            zip.close()
        }
    }
}

tasks.register('writeReleaseChecksums') {
    group = 'verification'
    dependsOn tasks.named('verifyReleaseArtifacts')
    def output = layout.buildDirectory.file('release/SHA256SUMS')
    outputs.file(output)
    doLast {
        File libs = layout.buildDirectory.dir('libs').get().asFile
        File checksumFile = output.get().asFile
        checksumFile.parentFile.mkdirs()
        checksumFile.setText(releaseFiles.get().collect { name ->
            File candidate = new File(libs, name)
            MessageDigest digest = MessageDigest.getInstance('SHA-256')
            candidate.withInputStream { input ->
                byte[] buffer = new byte[8192]
                for (int read = input.read(buffer); read >= 0; read = input.read(buffer)) {
                    if (read > 0) digest.update(buffer, 0, read)
                }
            }
            "${digest.digest().encodeHex().toString().toUpperCase()}  ${name}"
        }.join('\n') + '\n', 'UTF-8')
    }
}

def preparedReleaseDir = providers.gradleProperty('preparedReleaseDir')
tasks.register('verifyPreparedReleaseArtifacts') {
    group = 'verification'
    onlyIf { preparedReleaseDir.isPresent() }
    doLast {
        File prepared = file(preparedReleaseDir.get())
        Set<String> expected = (releaseFiles.get() + ['SHA256SUMS', 'CHANGELOG.md']) as Set<String>
        Set<String> actual = prepared.listFiles()?.findAll { it.isFile() }*.name as Set<String>
        if (actual != expected) {
            throw new GradleException(
                    "Prepared release files differ: expected ${expected}, found ${actual}")
        }
    }
}

def mavenUploadUrl = providers.environmentVariable('MAVEN_UPLOAD_URL')
def mavenUploadUsername = providers.environmentVariable('MAVEN_UPLOAD_USERNAME')
def mavenUploadPassword = providers.environmentVariable('MAVEN_UPLOAD_PASSWORD')
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifactId = base.archivesName.get()
            if (preparedReleaseDir.isPresent()) {
                artifact(file("${preparedReleaseDir.get()}/${releaseFiles.get()[0]}")) {
                    extension = 'jar'
                }
                artifact(file("${preparedReleaseDir.get()}/${releaseFiles.get()[1]}")) {
                    classifier = 'sources'
                    extension = 'jar'
                }
                artifact(file("${preparedReleaseDir.get()}/${releaseFiles.get()[2]}")) {
                    classifier = 'javadoc'
                    extension = 'jar'
                }
            } else {
                artifact releaseJar
                artifact tasks.named('sourcesJar')
                artifact tasks.named('javadocJar')
            }
            pom {
                name = "Sky's Grass Slabs"
                description = project.mod_description
                url = 'https://github.com/MinecraftModDevelopmentMods/SkysGrassSlabs'
                licenses {
                    license {
                        name = 'GNU Lesser General Public License, Version 2.1'
                        url = 'https://www.gnu.org/licenses/old-licenses/lgpl-2.1.txt'
                    }
                }
                scm {
                    connection = 'scm:git:https://github.com/MinecraftModDevelopmentMods/SkysGrassSlabs.git'
                    developerConnection = 'scm:git:ssh://git@github.com/MinecraftModDevelopmentMods/SkysGrassSlabs.git'
                    url = 'https://github.com/MinecraftModDevelopmentMods/SkysGrassSlabs'
                }
            }
        }
    }
    repositories {
        maven {
            name = 'release'
            url = mavenUploadUrl.isPresent()
                    ? uri(mavenUploadUrl.get())
                    : layout.buildDirectory.dir('forbidden-local-release').get().asFile.toURI()
            credentials {
                username = mavenUploadUsername.orNull ?: ''
                password = mavenUploadPassword.orNull ?: ''
            }
        }
    }
}

tasks.register('validateMavenReleaseCredentials') {
    group = 'publishing'
    doLast {
        if (!mavenUploadUrl.isPresent() || !mavenUploadUsername.isPresent() ||
                !mavenUploadPassword.isPresent()) {
            throw new GradleException(
                    'MAVEN_UPLOAD_URL, MAVEN_UPLOAD_USERNAME, and MAVEN_UPLOAD_PASSWORD are required')
        }
        if (mavenUploadUrl.get().startsWith('file:')) {
            throw new GradleException('Maven release publication must use a remote repository')
        }
    }
}

tasks.withType(PublishToMavenRepository).configureEach {
    dependsOn tasks.named('validateMavenReleaseCredentials')
    if (preparedReleaseDir.isPresent()) {
        dependsOn tasks.named('verifyPreparedReleaseArtifacts')
    } else {
        dependsOn tasks.named('verifyReleaseArtifacts')
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

tasks.withType(Test).configureEach {
    workingDir = project.projectDir
}

def prepareEclipseResources = tasks.register('prepareEclipseResources') {
    group = 'ide'
    description = 'Copies processed resources into Eclipse production output.'
    dependsOn tasks.named('processResources')
    doLast {
        project.copy {
            from(layout.buildDirectory.dir('resources/main'))
            into(layout.projectDirectory.dir('bin/main'))
        }
    }
}

def configureEclipseBuildship = tasks.register('configureEclipseBuildship') {
    group = 'ide'
    description = 'Pins Eclipse Buildship to the same Gradle home used to generate Forge runs.'
    doLast {
        File preferencesFile = file('.settings/org.eclipse.buildship.core.prefs')
        Properties preferences = new Properties()
        if (preferencesFile.isFile()) {
            preferencesFile.withInputStream { preferences.load(it) }
        }
        preferences.setProperty('eclipse.preferences.version', '1')
        preferences.setProperty('connection.gradle.distribution', 'GRADLE_DISTRIBUTION(WRAPPER)')
        preferences.setProperty('connection.gradle.user.home', gradle.gradleUserHomeDir.canonicalPath)
        preferences.setProperty('connection.project.dir', '')
        preferences.setProperty('gradle.user.home', gradle.gradleUserHomeDir.canonicalPath)
        preferences.setProperty('override.workspace.settings', 'true')
        preferencesFile.parentFile.mkdirs()
        preferencesFile.withOutputStream { preferences.store(it, 'Generated Buildship configuration.') }
    }
}

eclipse {
    classpath {
        downloadSources = true
        downloadJavadoc = true
        file.whenMerged { classpath ->
            classpath.entries.removeAll { entry ->
                entry instanceof org.gradle.plugins.ide.eclipse.model.SourceFolder &&
                        ['src/main/resources', 'src/generated/resources'].contains(entry.path)
            }
            if (!classpath.entries.any { entry -> entry.path == 'build/resources/main' }) {
                classpath.entries.add(new org.gradle.plugins.ide.eclipse.model.SourceFolder(
                        'build/resources/main', 'bin/main'))
            }
        }
    }
    synchronizationTasks 'isolateEclipseProductionRuns'
}

def syncForge40EclipseLaunches = tasks.register('syncForge40EclipseLaunches') {
    group = 'ide'
    description = 'Normalizes ForgeGradle 7 Eclipse launch outputs for Forge 40.'
    doLast {
        String mainOutput = new File(projectDir, 'bin/main').absolutePath
        String gameTestOutput = new File(projectDir, 'bin/gameTest').absolutePath
        String productionModClasses = "${mod_id}%%${mainOutput}"
        String gameTestModClasses = productionModClasses + File.pathSeparator +
                "${mod_id}%%${gameTestOutput}"

        ['Client', 'Server', 'Data'].each { String runName ->
            File launch = file("run${runName}.launch")
            if (!launch.isFile()) {
                throw new GradleException("Missing generated Eclipse launch: ${launch}")
            }
            String text = launch.getText('UTF-8').replaceFirst(
                    /<mapEntry key="MOD_CLASSES" value="[^"]*"\/>/,
                    java.util.regex.Matcher.quoteReplacement(
                            "<mapEntry key=\"MOD_CLASSES\" value=\"${productionModClasses}\"/>"))
            if (!text.contains('org.eclipse.jdt.launching.ATTR_EXCLUDE_TEST_CODE')) {
                text = text.replace('</launchConfiguration>',
                        '  <booleanAttribute key="org.eclipse.jdt.launching.ATTR_EXCLUDE_TEST_CODE" value="true"/>\r\n' +
                                '</launchConfiguration>')
            }
            launch.setText(text.replace('\r\n', '\n'), 'UTF-8')
        }

        File gameTestLaunch = file('runGameTestServer.launch')
        if (!gameTestLaunch.isFile()) {
            throw new GradleException("Missing generated Eclipse launch: ${gameTestLaunch}")
        }
        String gameTestText = gameTestLaunch.getText('UTF-8').replaceFirst(
                /<mapEntry key="MOD_CLASSES" value="[^"]*"\/>/,
                java.util.regex.Matcher.quoteReplacement(
                        "<mapEntry key=\"MOD_CLASSES\" value=\"${gameTestModClasses}\"/>"))
        gameTestLaunch.setText(gameTestText.replace('\r\n', '\n'), 'UTF-8')
    }
}

tasks.matching { it.name == 'genEclipseRuns' }.configureEach {
    finalizedBy syncForge40EclipseLaunches
}

def isolateEclipseProductionRuns = tasks.register('isolateEclipseProductionRuns') {
    group = 'ide'
    description = 'Prepares the complete ForgeGradle 7 Eclipse project configuration.'
    dependsOn tasks.named('genEclipseRuns')
    dependsOn syncForge40EclipseLaunches
    dependsOn configureEclipseBuildship
    dependsOn prepareEclipseResources
}

def verifyEclipseConfiguration = tasks.register('verifyEclipseConfiguration') {
    group = 'verification'
    description = 'Rejects duplicate Eclipse dependencies, caches, outputs, and test leakage.'
    dependsOn isolateEclipseProductionRuns
    dependsOn tasks.named('eclipseClasspath')
    doLast {
        File classpathFile = file('.classpath')
        String classpathText = classpathFile.getText('UTF-8')
        int explicitLibraryCount = classpathText.count('kind="lib"')
        int buildshipContainerCount = classpathText.count(
                'org.eclipse.buildship.core.gradleclasspathcontainer')
        if (buildshipContainerCount > 1) {
            throw new GradleException('Eclipse classpath contains duplicate Buildship containers')
        }
        if (explicitLibraryCount == 0 && buildshipContainerCount != 1) {
            throw new GradleException('Eclipse classpath contains neither the Gradle model nor its Buildship container')
        }
        if (explicitLibraryCount > 0 &&
                !classpathText.contains("forge-${minecraft_version}-${forge_version}.jar")) {
            throw new GradleException('ForgeGradle 7 Eclipse model is missing the mapped Forge dependency')
        }
        if (!classpathText.contains('path="build/resources/main"') ||
                classpathText.contains('path="src/main/resources"') ||
                classpathText.contains('path="src/generated/resources"')) {
            throw new GradleException('Eclipse must consume only Gradle-processed production resources')
        }

        File preferencesFile = file('.settings/org.eclipse.buildship.core.prefs')
        Properties preferences = new Properties()
        preferencesFile.withInputStream { preferences.load(it) }
        String expectedGradleHome = gradle.gradleUserHomeDir.canonicalPath
        if (preferences.getProperty('connection.gradle.user.home') != expectedGradleHome ||
                preferences.getProperty('gradle.user.home') != expectedGradleHome ||
                preferences.getProperty('override.workspace.settings') != 'true') {
            throw new GradleException("Eclipse Buildship is not pinned to ${expectedGradleHome}")
        }

        String mainOutput = new File(projectDir, 'bin/main').absolutePath
        String expectedProductionClasses = "${mod_id}%%${mainOutput}"
        ['Client', 'Server', 'Data'].each { String runName ->
            File launch = file("run${runName}.launch")
            String text = launch.getText('UTF-8')
            if (!text.contains("key=\"MOD_CLASSES\" value=\"${expectedProductionClasses}\"") ||
                    !text.contains('org.eclipse.jdt.launching.ATTR_EXCLUDE_TEST_CODE') ||
                    !text.contains('value="net.minecraftforge.launcher.Main"') ||
                    !text.contains('org.eclipse.jdt.launching.DEFAULT_CLASSPATH" value="false"') ||
                    text.count('org.eclipse.buildship.core.gradleclasspathcontainer') != 1) {
                throw new GradleException("Eclipse production launch is not isolated: ${launch}")
            }
        }

        String expectedGameTestClasses = expectedProductionClasses + File.pathSeparator +
                "${mod_id}%%${new File(projectDir, 'bin/gameTest').absolutePath}"
        File gameTestLaunch = file('runGameTestServer.launch')
        if (!gameTestLaunch.getText('UTF-8').contains(
                "key=\"MOD_CLASSES\" value=\"${expectedGameTestClasses}\"")) {
            throw new GradleException("Eclipse GameTest launch is not isolated: ${gameTestLaunch}")
        }

        File modMetadata = file('bin/main/META-INF/mods.toml')
        if (!modMetadata.isFile() || modMetadata.getText('UTF-8').contains('${mod_version}') ||
                !modMetadata.getText('UTF-8').contains("version=\"${project.version}\"")) {
            throw new GradleException('Eclipse output contains missing or unexpanded Forge metadata')
        }
    }
}

tasks.named('eclipse').configure {
    dependsOn isolateEclipseProductionRuns
    finalizedBy verifyEclipseConfiguration
}

def prepareGameTestStructures = tasks.register('prepareGameTestStructures', Copy) {
    from 'src/gameTest/resources/gameteststructures'
    into "${gameTestRunDirectory}/gameteststructures"
}

tasks.matching { it.name == 'prepareRunGameTestServer' || it.name == 'runGameTestServer' }.configureEach {
    dependsOn prepareGameTestStructures
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
