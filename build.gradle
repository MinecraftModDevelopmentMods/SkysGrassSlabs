def prepareDisposableRun = { File directory ->
    File target = directory.canonicalFile
    File buildRoot = layout.buildDirectory.get().asFile.canonicalFile
    if (!target.path.startsWith(buildRoot.path + File.separator)) {
        throw new GradleException('Verification runtimes must remain inside the project build directory')
    }
    if (target.isDirectory() && target.listFiles().length != 0) {
        throw new GradleException('Archive the previous runtime evidence before preparing another run: ' + target.name)
    }
    target.mkdirs()
}
