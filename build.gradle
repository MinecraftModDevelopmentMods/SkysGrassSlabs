def configureEclipseBuildship = tasks.register('configureEclipseBuildship') {
    group = 'ide'
    description = 'Pins Eclipse Buildship to the same Gradle home used to generate Forge runs.'
    doLast {
        File preferencesFile = file('.settings/org.eclipse.buildship.core.prefs')
        Properties preferences = new Properties()
        if (preferencesFile.isFile()) {
            preferencesFile.withInputStream { preferences.load(it) }
        }
        preferences.setProperty('eclipse.preferences.version', '1')
        preferences.setProperty('connection.gradle.distribution', 'GRADLE_DISTRIBUTION(WRAPPER)')
        preferences.setProperty('connection.gradle.user.home', gradle.gradleUserHomeDir.canonicalPath)
        preferences.setProperty('connection.project.dir', '')
        preferences.setProperty('gradle.user.home', gradle.gradleUserHomeDir.canonicalPath)
        preferences.setProperty('override.workspace.settings', 'true')
        preferencesFile.parentFile.mkdirs()
        preferencesFile.withOutputStream { preferences.store(it, 'Generated Buildship configuration.') }
    }
}

eclipse {
    classpath {
        downloadSources = true
        downloadJavadoc = true
        file.whenMerged { classpath ->
            classpath.entries.removeAll { entry ->
                entry instanceof org.gradle.plugins.ide.eclipse.model.SourceFolder &&
                        ['src/main/resources', 'src/generated/resources'].contains(entry.path)
            }
            if (!classpath.entries.any { entry -> entry.path == 'build/resources/main' }) {
                classpath.entries.add(new org.gradle.plugins.ide.eclipse.model.SourceFolder(
                        'build/resources/main', 'bin/main'))
            }
        }
    }
    synchronizationTasks 'isolateEclipseProductionRuns'
}

def syncForge50EclipseLaunches = tasks.register('syncForge50EclipseLaunches') {
    group = 'ide'
    description = 'Normalizes ForgeGradle 7 Eclipse launch outputs for Forge 50.'
    doLast {
        String mainOutput = new File(projectDir, 'bin/main').absolutePath
        String gameTestOutput = new File(projectDir, 'bin/gameTest').absolutePath
        String productionModClasses = "${mod_id}%%${mainOutput}"
        String gameTestModClasses = productionModClasses + File.pathSeparator +
                "${mod_id}%%${gameTestOutput}"

        ['Client', 'Server', 'Data'].each { String runName ->
            File launch = file("run${runName}.launch")
            if (!launch.isFile()) {
                throw new GradleException("Missing generated Eclipse launch: ${launch}")
            }
            String text = launch.getText('UTF-8')
            if (text.contains('<mapAttribute key="org.eclipse.debug.core.environmentVariables"/>')) {
                text = text.replace(
                        '<mapAttribute key="org.eclipse.debug.core.environmentVariables"/>',
                        '<mapAttribute key="org.eclipse.debug.core.environmentVariables">\r\n' +
                                "    <mapEntry key=\"MOD_CLASSES\" value=\"${productionModClasses}\"/>\r\n" +
                                '</mapAttribute>')
            }
            if (!text.contains('<mapEntry key="MOD_CLASSES"')) {
                text = text.replaceFirst(
                        /<mapAttribute key="org\.eclipse\.debug\.core\.environmentVariables">\r?\n/,
                        { String environmentHeader ->
                            environmentHeader +
                                    "    <mapEntry key=\"MOD_CLASSES\" value=\"${productionModClasses}\"/>\r\n"
                        })
            }
            text = text.replaceFirst(
                    /<mapEntry key="MOD_CLASSES" value="[^"]*"\/>/,
                    java.util.regex.Matcher.quoteReplacement(
                            "<mapEntry key=\"MOD_CLASSES\" value=\"${productionModClasses}\"/>"))
            if (!text.contains('org.eclipse.jdt.launching.ATTR_EXCLUDE_TEST_CODE')) {
                text = text.replace('</launchConfiguration>',
                        '  <booleanAttribute key="org.eclipse.jdt.launching.ATTR_EXCLUDE_TEST_CODE" value="true"/>\r\n' +
                                '</launchConfiguration>')
            }
            launch.setText(text.replace('\r\n', '\n'), 'UTF-8')
        }

        File gameTestLaunch = file('runGameTestServer.launch')
        if (!gameTestLaunch.isFile()) {
            throw new GradleException("Missing generated Eclipse launch: ${gameTestLaunch}")
        }
        String gameTestText = gameTestLaunch.getText('UTF-8')
        if (gameTestText.contains('<mapAttribute key="org.eclipse.debug.core.environmentVariables"/>')) {
            gameTestText = gameTestText.replace(
                    '<mapAttribute key="org.eclipse.debug.core.environmentVariables"/>',
                    '<mapAttribute key="org.eclipse.debug.core.environmentVariables">\r\n' +
                            "    <mapEntry key=\"MOD_CLASSES\" value=\"${gameTestModClasses}\"/>\r\n" +
                            '</mapAttribute>')
        }
        if (!gameTestText.contains('<mapEntry key="MOD_CLASSES"')) {
            gameTestText = gameTestText.replaceFirst(
                    /<mapAttribute key="org\.eclipse\.debug\.core\.environmentVariables">\r?\n/,
                    { String environmentHeader ->
                        environmentHeader +
                                "    <mapEntry key=\"MOD_CLASSES\" value=\"${gameTestModClasses}\"/>\r\n"
                    })
        }
        gameTestText = gameTestText.replaceFirst(
                /<mapEntry key="MOD_CLASSES" value="[^"]*"\/>/,
                java.util.regex.Matcher.quoteReplacement(
                        "<mapEntry key=\"MOD_CLASSES\" value=\"${gameTestModClasses}\"/>"))
        gameTestLaunch.setText(gameTestText.replace('\r\n', '\n'), 'UTF-8')
    }
}

tasks.matching { it.name == 'genEclipseRuns' }.configureEach {
    finalizedBy syncForge50EclipseLaunches
}

def isolateEclipseProductionRuns = tasks.register('isolateEclipseProductionRuns') {
    group = 'ide'
    description = 'Prepares the complete ForgeGradle 7 Eclipse project configuration.'
    dependsOn tasks.named('genEclipseRuns')
    dependsOn syncForge50EclipseLaunches
    dependsOn configureEclipseBuildship
    dependsOn prepareEclipseResources
}

def verifyEclipseConfiguration = tasks.register('verifyEclipseConfiguration') {
    group = 'verification'
    description = 'Rejects duplicate Eclipse dependencies, caches, outputs, and test leakage.'
    dependsOn isolateEclipseProductionRuns
    dependsOn tasks.named('eclipseClasspath')
    doLast {
        File classpathFile = file('.classpath')
        String classpathText = classpathFile.getText('UTF-8')
        int explicitLibraryCount = classpathText.count('kind="lib"')
        int buildshipContainerCount = classpathText.count(
                'org.eclipse.buildship.core.gradleclasspathcontainer')
        if (buildshipContainerCount > 1) {
            throw new GradleException('Eclipse classpath contains duplicate Buildship containers')
        }
        if (explicitLibraryCount == 0 && buildshipContainerCount != 1) {
            throw new GradleException('Eclipse classpath contains neither the Gradle model nor its Buildship container')
        }
        if (explicitLibraryCount > 0 &&
                !classpathText.contains("forge-${minecraft_version}-${forge_version}.jar")) {
            throw new GradleException('ForgeGradle 7 Eclipse model is missing the mapped Forge dependency')
        }
        if (!classpathText.contains('path="build/resources/main"') ||
                classpathText.contains('path="src/main/resources"') ||
                classpathText.contains('path="src/generated/resources"')) {
            throw new GradleException('Eclipse must consume only Gradle-processed production resources')
        }

        File preferencesFile = file('.settings/org.eclipse.buildship.core.prefs')
        Properties preferences = new Properties()
        preferencesFile.withInputStream { preferences.load(it) }
        String expectedGradleHome = gradle.gradleUserHomeDir.canonicalPath
        if (preferences.getProperty('connection.gradle.user.home') != expectedGradleHome ||
                preferences.getProperty('gradle.user.home') != expectedGradleHome ||
                preferences.getProperty('override.workspace.settings') != 'true') {
            throw new GradleException("Eclipse Buildship is not pinned to ${expectedGradleHome}")
        }

        String mainOutput = new File(projectDir, 'bin/main').absolutePath
        String expectedProductionClasses = "${mod_id}%%${mainOutput}"
        ['Client', 'Server', 'Data'].each { String runName ->
            File launch = file("run${runName}.launch")
            String text = launch.getText('UTF-8')
            if (!text.contains("key=\"MOD_CLASSES\" value=\"${expectedProductionClasses}\"") ||
                    !text.contains('org.eclipse.jdt.launching.ATTR_EXCLUDE_TEST_CODE') ||
                    !text.contains('value="net.minecraftforge.launcher.Main"') ||
                    !text.contains('org.eclipse.jdt.launching.DEFAULT_CLASSPATH" value="false"') ||
                    text.count('org.eclipse.buildship.core.gradleclasspathcontainer') != 1) {
                throw new GradleException("Eclipse production launch is not isolated: ${launch}")
            }
        }

        String expectedGameTestClasses = expectedProductionClasses + File.pathSeparator +
                "${mod_id}%%${new File(projectDir, 'bin/gameTest').absolutePath}"
        File gameTestLaunch = file('runGameTestServer.launch')
        if (!gameTestLaunch.getText('UTF-8').contains(
                "key=\"MOD_CLASSES\" value=\"${expectedGameTestClasses}\"")) {
            throw new GradleException("Eclipse GameTest launch is not isolated: ${gameTestLaunch}")
        }

        File modMetadata = file('bin/main/META-INF/mods.toml')
        if (!modMetadata.isFile() || modMetadata.getText('UTF-8').contains('${mod_version}') ||
                !modMetadata.getText('UTF-8').contains("version=\"${project.version}\"")) {
            throw new GradleException('Eclipse output contains missing or unexpanded Forge metadata')
        }
    }
}

tasks.named('eclipse').configure {
    dependsOn isolateEclipseProductionRuns
    finalizedBy verifyEclipseConfiguration
}

def prepareGameTestStructures = tasks.register('prepareGameTestStructures', Copy) {
    from 'src/gameTest/resources/gameteststructures'
    into "${gameTestRunDirectory}/gameteststructures"
    doLast {
        File properties = file("${gameTestRunDirectory}/server.properties")
        properties.parentFile.mkdirs()
        properties.setText('online-mode=false\nserver-port=0\n', 'UTF-8')
    }
}

tasks.matching { it.name == 'prepareRunGameTestServer' || it.name == 'runGameTestServer' }.configureEach {
    dependsOn prepareGameTestStructures
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
