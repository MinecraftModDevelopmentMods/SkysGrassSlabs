tasks.register('verifyReleaseMetadata') {
    group = 'verification'
    doLast {
        if (project.minecraft_version != '1.20.6' || project.forge_version != '50.2.0' ||
                project.mapping_channel != 'official' || project.mapping_version != '1.20.6' ||
                project.loader_name != 'forge' || project.loader_code != '1' ||
                project.java_version != '21' || project.java_toolchain_version != '21.0.7+6' ||
                project.gradle_java_version != '21' || project.curseforge_project_id != '1677588') {
            throw new GradleException('Unexpected 1.20.6 release metadata')
        }
    }
}

tasks.register('verifyReleaseArtifacts') {
    group = 'verification'
    dependsOn tasks.named('assemble'), tasks.named('verifyReleaseMetadata')
    doLast {
        File libs = layout.buildDirectory.dir('libs').get().asFile
        List<String> actualReleaseFiles = (libs.listFiles() ?: [] as File[])
                .findAll { it.name.endsWith('.jar') }
                .collect { it.name }
                .sort()
        List<String> expectedReleaseFiles = releaseFiles.get().collect { it.toString() }.sort()
        if (actualReleaseFiles != expectedReleaseFiles) {
            throw new GradleException(
                    "Expected exactly ${expectedReleaseFiles}, found ${actualReleaseFiles}")
        }
        releaseFiles.get().each { name ->
            File candidate = new File(libs, name)
            if (!candidate.isFile() || candidate.length() == 0) {
                throw new GradleException("Missing release artifact: ${candidate}")
            }
        }

        ZipFile zip = new ZipFile(new File(libs, releaseFiles.get()[0]))
        try {
            Set<String> names = zip.entries().collect { it.name } as Set<String>
            ['META-INF/mods.toml', 'META-INF/LICENSE', 'META-INF/LICENSE.spdx',
             'META-INF/NOTICE',
             'META-INF/coremods.json',
             'coremods/skysgrassslabs_legacy_world.js',
             'assets/skysgrassslabs/lang/en_us.json',
             'assets/skysgrassslabs/lang/zh_cn.json',
             'assets/grassslabs/blockstates/grass_slab.json',
             'assets/grassslabs/blockstates/dirt_slab.json',
             'assets/grassslabs/blockstates/dirt_path_slab.json',
             'assets/grassslabs/blockstates/grass_carpet.json',
             'data/grassslabs/loot_tables/blocks/grass_carpet.json',
             'data/forge/tags/items/seeds.json',
             'data/skysgrassslabs/forge/biome_modifier/grass_slab_smoothing.json',
             'zone/moddev/mc/skysgrassslabs/SkysGrassSlabs.class',
             'zone/moddev/mc/skysgrassslabs/compat/GrassSlabsCompat.class',
             'zone/moddev/mc/skysgrassslabs/compat/GrassSlabsMigrationHandler.class',
             'zone/moddev/mc/skysgrassslabs/compat/LegacyCarpetAliasBlock.class',
             'zone/moddev/mc/skysgrassslabs/world/SmoothingBiomeModifier.class'].each { required ->
                if (!names.contains(required)) {
                    throw new GradleException("Release jar is missing ${required}")
                }
            }
            Set<String> forbidden = names.findAll { entry ->
                String lower = entry.toLowerCase(Locale.ROOT)
                lower.contains('agent') || lower.contains('.codex') || lower.contains('.claude') ||
                        lower.contains('/test/') || lower.contains('gametest') ||
                        lower.startsWith('d' + ':' + '/') ||
                        lower.startsWith('c' + ':' + '/users/')
            }
            if (!forbidden.isEmpty()) {
                throw new GradleException("Forbidden release entries: ${forbidden}")
            }

            zip.entries().findAll { it.name.endsWith('.class') }.each { entry ->
                byte[] header = new byte[8]
                zip.getInputStream(entry).withCloseable { input ->
                    if (input.read(header) != 8) {
                        throw new GradleException("Cannot inspect ${entry.name}")
                    }
                }
                int major = ((header[6] & 0xff) << 8) | (header[7] & 0xff)
                if (major != 65) {
                    throw new GradleException(
                            "${entry.name} uses class major ${major}, expected 65")
                }
            }

            String metadata = zip.getInputStream(zip.getEntry('META-INF/mods.toml'))
                    .getText(StandardCharsets.UTF_8.name())
            if (!metadata.contains('versionRange="[1.20.6,1.20.7)"') ||
                    !metadata.contains('versionRange="[50,)"')) {
                throw new GradleException('Packaged Forge metadata targets the wrong version')
            }

            String windowsPathPrefix = ':' + ((char) 92)
            List<String> forbiddenContent = [
                    'c' + windowsPathPrefix + 'users' + ((char) 92),
                    'd' + windowsPathPrefix + 'skysgrassslabs',
                    '/' + 'home' + '/' + 'runner' + '/',
                    'agent-notes', 'agent_notes', '.codex', '.claude', '.cursor'
            ]
            zip.entries().each { entry ->
                if (!entry.directory) {
                    String content = new String(zip.getInputStream(entry).bytes,
                            StandardCharsets.ISO_8859_1).toLowerCase(Locale.ROOT)
                    String match = forbiddenContent.find { content.contains(it) }
                    if (match != null) {
                        throw new GradleException(
                                "Release entry ${entry.name} contains forbidden local context: ${match}")
                    }
                }
            }
        } finally {
            zip.close()
        }
    }
}

tasks.register('writeReleaseChecksums') {
    group = 'verification'
    dependsOn tasks.named('verifyReleaseArtifacts')
    def output = layout.buildDirectory.file('release/SHA256SUMS')
    outputs.file(output)
    doLast {
        File libs = layout.buildDirectory.dir('libs').get().asFile
        File checksumFile = output.get().asFile
        checksumFile.parentFile.mkdirs()
        checksumFile.setText(releaseFiles.get().collect { name ->
            File candidate = new File(libs, name)
            MessageDigest digest = MessageDigest.getInstance('SHA-256')
            candidate.withInputStream { input ->
                byte[] buffer = new byte[8192]
                for (int read = input.read(buffer); read >= 0; read = input.read(buffer)) {
                    if (read > 0) digest.update(buffer, 0, read)
                }
            }
            "${digest.digest().encodeHex().toString().toUpperCase()}  ${name}"
        }.join('\n') + '\n', 'UTF-8')
    }
}

def preparedReleaseDir = providers.gradleProperty('preparedReleaseDir')
tasks.register('verifyPreparedReleaseArtifacts') {
    group = 'verification'
    onlyIf { preparedReleaseDir.isPresent() }
    doLast {
        File prepared = file(preparedReleaseDir.get())
        Set<String> expected = (releaseFiles.get() + ['SHA256SUMS', 'CHANGELOG.md']) as Set<String>
        Set<String> actual = prepared.listFiles()?.findAll { it.isFile() }*.name as Set<String>
        if (actual != expected) {
            throw new GradleException(
                    "Prepared release files differ: expected ${expected}, found ${actual}")
        }
    }
}

