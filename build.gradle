def createPackagedServerProcess = { String taskName, String phase, String directoryName,
        Object dependency ->
    tasks.register(taskName, Exec) {
        group = 'verification'
        dependsOn dependency
        File runDirectory = layout.buildDirectory.dir(directoryName).get().asFile
        workingDir runDirectory
        doFirst {
            File runtime = requireRuntimeDirectory(packagedForgeServerRuntime,
                    'packagedForgeServerRuntime')
            File libraries = new File(runtime, 'libraries')
            File forgeDirectory = new File(libraries,
                    "net/neoforged/forge/${project.minecraft_version}-${project.forge_version}")
            File launcher = new File(forgeDirectory,
                    "forge-${project.minecraft_version}-${project.forge_version}-server.jar")
            File sourceArguments = new File(forgeDirectory,
                    System.getProperty('os.name').toLowerCase(Locale.ROOT).contains('windows')
                            ? 'win_args.txt' : 'unix_args.txt')
            [launcher, sourceArguments, libraries].each {
                if (!it.exists()) throw new GradleException(
                        "Incomplete official NeoForge server runtime: ${it}")
            }
            File absoluteArguments = new File(runDirectory, 'forge-server-args.txt')
            String libraryPath = libraries.canonicalPath.replace('\\', '/') + '/'
            absoluteArguments.setText(sourceArguments.getText('UTF-8')
                    .replace('libraries/', libraryPath)
                    .replace('-DlibraryDirectory=libraries',
                            "-DlibraryDirectory=${libraries.canonicalPath}"), 'UTF-8')
            List<String> command = [
                    java17Launcher.get().executablePath.asFile.absolutePath,
                    '-Djava.net.preferIPv4Stack=true',
                    '-Dforge.logging.console.level=info',
                    "-Dskysgrassslabs.integrationPhase=${phase}"
            ]
            if (phase.startsWith('forward-sylvester')) {
                command.addAll(['-Xms1G', '-Xmx8G'])
            } else {
                command.add('-Xmx3G')
            }
            if (phase.startsWith('upgrade-') || phase.startsWith('forward-sylvester')) {
                command.add('-Dfml.queryResult=confirm')
            }
            command.addAll(["@${absoluteArguments.absolutePath}", 'nogui'])
            commandLine command
        }
        doLast {
            File marker = new File(runDirectory,
                    'world/skysgrassslabs-integration.properties')
            if (!marker.isFile()) {
                throw new GradleException("Packaged ${phase} marker is missing: ${marker}")
            }
            Properties values = new Properties()
            marker.withInputStream { values.load(it) }
            String key = phase.replace('-', '_') + '_complete'
            if (values.getProperty(key) != 'true') {
                throw new GradleException("Packaged ${phase} did not complete: ${marker}")
            }
        }
    }
}

