def packagedClientProcess = tasks.register('packagedClientProcess', Exec) {
    group = 'verification'
    dependsOn preparePackagedClientIntegration
    workingDir packagedClientRunDirectory
    doFirst {
        if (!packagedForgeClientRuntime.isPresent()) {
            throw new GradleException(
                    'Set -PpackagedForgeClientRuntime to an official Forge 31 client runtime')
        }
        File runtime = file(packagedForgeClientRuntime.get())
        File forgeJsonFile = new File(runtime,
                'versions/1.15.2-forge-31.2.57/1.15.2-forge-31.2.57.json')
        File baseJsonFile = new File(runtime, 'versions/1.15.2/1.15.2.json')
        File baseJar = new File(runtime, 'versions/1.15.2/1.15.2.jar')
        File libraries = new File(runtime, 'libraries')
        File assets = packagedForgeClientAssets.isPresent()
                ? file(packagedForgeClientAssets.get()) : new File(runtime, 'assets')
        File natives = packagedForgeClientNatives.isPresent()
                ? file(packagedForgeClientNatives.get())
                : new File(runtime, 'natives')
        [forgeJsonFile, baseJsonFile, baseJar, libraries, assets, natives].each { entry ->
            if (!entry.exists()) {
                throw new GradleException("Incomplete installed Forge client: ${entry}")
            }
        }

        def slurper = new groovy.json.JsonSlurper()
        Map forgeJson = (Map) slurper.parse(forgeJsonFile)
        Map baseJson = (Map) slurper.parse(baseJsonFile)
        Map<String, Map> librariesByModule = new LinkedHashMap<String, Map>()
        [baseJson, forgeJson].each { Map metadata ->
            ((List<Map>) metadata.libraries).each { Map library ->
                List<Map> rules = (List<Map>) library.rules
                boolean allowed = rules == null || rules.isEmpty()
                if (rules != null) {
                    rules.each { Map rule ->
                        Map os = (Map) rule.os
                        boolean matches = os == null ||
                                (os.name == 'windows' &&
                                (os.arch == null || os.arch == System.getProperty('os.arch')))
                        if (matches) allowed = rule.action == 'allow'
                    }
                }
                if (!allowed) return
                Map downloads = (Map) library.downloads
                Map artifact = downloads == null ? null : (Map) downloads.artifact
                if (artifact == null) return
                List<String> coordinates = ((String) library.name).split(':') as List<String>
                String module = coordinates.size() >= 2
                        ? "${coordinates[0]}:${coordinates[1]}" : (String) library.name
                librariesByModule.put(module, library)
            }
        }
        Map<String, File> classpathByModule = new LinkedHashMap<String, File>()
        librariesByModule.each { String module, Map library ->
            Map artifact = (Map) ((Map) library.downloads).artifact
            File libraryFile = new File(libraries, (String) artifact.path)
            if (!libraryFile.isFile()) {
                throw new GradleException("Missing installed client library: ${libraryFile}")
            }
            classpathByModule.put(module, libraryFile)
        }
        List<File> classpathFiles = new ArrayList<File>(classpathByModule.values())
        classpathFiles.add(baseJar)

        List<String> gameArguments = []
        gameArguments.addAll((List<String>) ((Map) forgeJson.arguments).game)
        gameArguments.addAll([
                '--username', 'SkysGrassSlabsValidation',
                '--version', '1.15.2-forge-31.2.57',
                '--gameDir', packagedClientRunDirectory.get().asFile.absolutePath,
                '--assetsDir', assets.absolutePath,
                '--assetIndex', (String) ((Map) baseJson.assetIndex).id,
                '--uuid', '00000000-0000-0000-0000-000000000001',
                '--accessToken', 'validation-token',
                '--userType', 'legacy',
                '--versionType', 'release',
                '--width', '854', '--height', '480'
        ])
        commandLine java8Launcher.get().executablePath.asFile.absolutePath,
                '-Xms512m', '-Xmx2g', '-Dskysgrassslabs.clientProbe=true',
                "-Djava.library.path=${natives.absolutePath}",
                '-Dminecraft.launcher.brand=skysgrassslabs-validation',
                '-Dminecraft.launcher.version=1',
                '-cp', classpathFiles.collect { it.absolutePath }.join(File.pathSeparator),
                (String) forgeJson.mainClass
        args gameArguments
    }
}

