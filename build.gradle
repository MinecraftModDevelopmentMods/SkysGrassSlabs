def clientIntegrationProcess = tasks.register('clientIntegrationProcess', Exec) {
    group = 'verification'
    dependsOn prepareClientIntegrationTest
    dependsOn {
        JavaExec run = tasks.getByName('runClient') as JavaExec
        run.taskDependencies.getDependencies(run)
    }
    doFirst {
        JavaExec run = tasks.getByName('runClient') as JavaExec
        File assets = file(forgeClientAssets.get())
        File natives = file(forgeClientNatives.get())
        File assetIndex = new File(assets, 'indexes/1.15.json')
        [assets, natives, assetIndex].each { entry ->
            if (!entry.exists()) {
                throw new GradleException("Incomplete Forge client runtime: ${entry}")
            }
        }
        File classpathJar = layout.buildDirectory.file(
                'client-integration-fixture/client-classpath.jar').get().asFile
        classpathJar.parentFile.mkdirs()
        java.util.jar.Manifest manifest = new java.util.jar.Manifest()
        manifest.mainAttributes.put(java.util.jar.Attributes.Name.MANIFEST_VERSION, '1.0')
        manifest.mainAttributes.put(java.util.jar.Attributes.Name.CLASS_PATH,
                run.classpath.files.collect { it.toURI().toASCIIString() }.join(' '))
        classpathJar.withOutputStream { output ->
            new java.util.jar.JarOutputStream(output, manifest).close()
        }

        List<String> arguments = new ArrayList<>(run.allJvmArgs)
        int classpathFlag = arguments.lastIndexOf('-cp')
        if (classpathFlag < 0) classpathFlag = arguments.lastIndexOf('-classpath')
        if (classpathFlag >= 0 && classpathFlag + 1 < arguments.size()) {
            arguments.remove(classpathFlag + 1)
            arguments.remove(classpathFlag)
        }
        arguments.add('-Dskysgrassslabs.clientProbe=true')
        arguments.add('-cp')
        arguments.add(classpathJar.absolutePath)
        arguments.add(run.mainClass.orNull ?: 'net.minecraftforge.userdev.LaunchTesting')
        arguments.addAll(run.args)

        Map<String, Object> clientEnvironment = new LinkedHashMap<>(run.environment)
        clientEnvironment.put('target', 'fmluserdevclient')
        clientEnvironment.put('MCP_MAPPINGS', "${mapping_channel}_${mapping_version}")
        clientEnvironment.put('MCP_VERSION', mcp_version)
        clientEnvironment.put('FORGE_VERSION', forge_version)
        clientEnvironment.put('FORGE_GROUP', 'net.minecraftforge')
        clientEnvironment.put('MC_VERSION', minecraft_version)
        clientEnvironment.put('assetDirectory', assets.absolutePath)
        clientEnvironment.put('assetIndex', '1.15')
        clientEnvironment.put('nativesDirectory', natives.absolutePath)
        clientEnvironment.put('MOD_CLASSES',
                "${mod_id}%%${forgeRunModClassesDirectory}${File.pathSeparator}" +
                        "${mod_id}%%${forgeRunModClassesDirectory}")
        workingDir clientIntegrationRunDirectory
        environment clientEnvironment
        commandLine(([java8Launcher.get().executablePath.asFile.absolutePath] +
                arguments) as List<String>)
    }
    doLast {
        File runDirectory = clientIntegrationRunDirectory.get().asFile
        File marker = new File(runDirectory, 'client-smoke-pass.properties')
        if (!marker.isFile()) {
            throw new GradleException("Development client marker is missing: ${marker}")
        }
        Properties values = new Properties()
        marker.withInputStream { values.load(it) }
        ['models_verified', 'recipe_book_verified', 'first_world_rendered',
                'reload_rendered'].each { key ->
            if (values.getProperty(key) != 'true') {
                throw new GradleException("Development client failed ${key}: ${values}")
            }
        }
    }
}

