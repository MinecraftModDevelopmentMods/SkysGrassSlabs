def java21Launcher = javaToolchains.launcherFor {
    languageVersion = JavaLanguageVersion.of(21)
    vendor = JvmVendorSpec.ADOPTIUM
}

tasks.register('verifyJava21Toolchain') {
    group = 'verification'
    description = 'Verifies the pinned Temurin Java 21 production toolchain.'
    doLast {
        def metadata = java21Launcher.get().metadata
        String runtimeVersion = metadata.javaRuntimeVersion
        if (project.java_toolchain_version != '21.0.7+6'
                || metadata.vendor.toString() != 'Eclipse Temurin'
                || !(runtimeVersion == '21.0.7+6' || runtimeVersion == '21.0.7+6-LTS')) {
            throw new GradleException("Expected Temurin ${project.java_toolchain_version}, found " +
                    "${metadata.vendor} ${runtimeVersion} at ${metadata.installationPath}")
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('verifyJava21Toolchain')
}

