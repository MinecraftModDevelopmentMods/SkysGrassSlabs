            }
            pom {
                name = "Sky's Grass Slabs"
                description = project.mod_description
                url = 'https://github.com/MinecraftModDevelopmentMods/SkysGrassSlabs'
                licenses {
                    license {
                        name = 'GNU Lesser General Public License, Version 2.1'
                        url = 'https://www.gnu.org/licenses/old-licenses/lgpl-2.1.txt'
                    }
                }
                scm {
                    connection = 'scm:git:https://github.com/MinecraftModDevelopmentMods/SkysGrassSlabs.git'
                    developerConnection = 'scm:git:ssh://git@github.com/MinecraftModDevelopmentMods/SkysGrassSlabs.git'
                    url = 'https://github.com/MinecraftModDevelopmentMods/SkysGrassSlabs'
                }
            }
        }
